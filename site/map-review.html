let graph,relief,interior,mapArea='03',mapPaintAt=0,mapButtonSignature='',data={reviewMode:true,mapOpen:true,area:'',visitedAreas:[]};const $=id=>document.getElementById(id);function buttons(container,items,action){container.replaceChildren(...items.map(item=>{const b=document.createElement('button');b.textContent=item.label;b.dataset.id=item.id;b.onclick=()=>action(item);return b}))}
function drawMap(){if(!graph||!data.mapOpen)return;mapPaintAt=performance.now();const a=graph.areas.find(x=>x.id===mapArea)||graph.areas.find(x=>x.id===data.area);if(!a)return;mapArea=a.id;const w=a.maxX-a.minX,h=a.maxN-a.minN,pad=Math.max(w,h)*.04,svg=$('map-svg'),terrain=relief?.areas.find(x=>x.id===a.id),inside=a.id==='05'&&interior;svg.setAttribute('viewBox',`${a.minX-pad} ${-a.maxN-pad} ${w+2*pad} ${h+2*pad}`);const u=Math.max((w+2*pad)/(svg.clientWidth||900),(h+2*pad)/(svg.clientHeight||600));svg.replaceChildren();function shape(tag,attrs){const el=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v]of Object.entries(attrs))el.setAttribute(k,v);svg.append(el);return el}function text(x,n,label,size=1.8,color='#f6edd2'){const t=shape('text',{x,y:-n,fill:color,'font-size':size*7*u,'paint-order':'stroke',stroke:'#243c2c','stroke-width':1.5*u});t.textContent=label;return t}
$('map-photo').disabled=!!inside;
if(terrain&&!inside){for(let row=0;row<terrain.rows;row++)for(let col=0;col<terrain.columns;col++){const y=terrain.heights[row*terrain.columns+col];if(y<-9000)continue;const t=(y-terrain.minY)/Math.max(1,terrain.maxY-terrain.minY);shape('rect',{x:terrain.minX+col*terrain.cellX,y:-(terrain.minN+(row+1)*terrain.cellN),width:terrain.cellX+.05,height:terrain.cellN+.05,fill:`hsl(${96-t*22} 18% ${28+t*25}%)`})}for(const f of terrain.features||[]){if(f.kind==='tree')shape('circle',{cx:f.x,cy:-f.n,r:f.w/2,fill:'#254a32',opacity:.75});if(f.kind==='water')shape('rect',{x:f.x-f.w/2,y:-f.n-f.d/2,width:f.w,height:f.d,fill:'#548e99',opacity:.85})}}
if(!inside&&$('map-photo').checked)shape('image',{href:'PlanImages/'+a.id+'-map.png',x:a.minX,y:-a.maxN,width:w,height:h,preserveAspectRatio:'none',opacity:.42});
if(inside)for(const s of interior.shapes.filter(s=>s.kind==='floor'))shape('rect',{x:s.x-s.width/2,y:-s.z-s.depth/2,width:s.width,height:s.depth,fill:'#939574',stroke:'#686f53','stroke-width':u});
for(const road of a.paths)shape('polyline',{points:road.points.map(p=>`${p.x},${-p.n}`).join(' '),fill:'none',stroke:'#d5c9a3','stroke-width':6*u,'stroke-linejoin':'round'});
if(inside){for(const s of interior.shapes.filter(s=>s.kind!=='floor')){const colors={wall:'#3b342a',partition:'#705b45',table:'#976b43',entrance:'#dfbd71'};shape('rect',{x:s.x-s.width/2,y:-s.z-s.depth/2,width:s.width,height:s.depth,fill:colors[s.kind]||'#735f47',stroke:'#e4d3ac','stroke-width':u});if(s.kind==='table'){const t=text(s.x,s.z,'卓',1.6);t.setAttribute('text-anchor','middle')}}for(const p of interior.places){shape('circle',{cx:p.x,cy:-p.z,r:4*u,fill:'#f5d894'});const right=p.x>(a.minX+a.maxX)/2,t=text(p.x+(right?-8:8)*u,p.z+(p.name.includes('受付')?-22:18)*u,p.name,1.7);if(right)t.setAttribute('text-anchor','end')}}
else{for(const b of a.buildings||[]){if(!b)continue;const fill=b.kind==='tower'?'#b7a675':'#697779';if(b.polygon?.length)shape('polygon',{points:b.polygon.map(p=>`${p.x},${-p.z}`).join(' '),fill,stroke:'#eee1ba','stroke-width':1.25*u});else shape('rect',{x:b.x-b.w/2,y:-b.n-b.d/2,width:b.w,height:b.d,fill,stroke:'#eee1ba','stroke-width':1.25*u});if(b.door)shape('circle',{cx:b.door.x,cy:-b.door.z,r:3*u,fill:'#efd9a0'});text(b.x-b.w/2,b.n+b.d/2+10*u,b.name,1.7)}for(const p of a.landmarks||[]){if(!p)continue;shape('circle',{cx:p.x,cy:-p.n,r:3*u,fill:'#e3b78b'});text(p.x+6*u,p.n,p.label,1.4,'#f2dab3')}}
for(const exit of a.exits){shape('circle',{cx:exit.x,cy:-exit.n,r:5*u,fill:'#e1ce82'});const right=exit.x>a.maxX-80*u,t=text(exit.x+(right?-10:10)*u,exit.n,'→ '+exit.destination,1.8);if(right)t.setAttribute('text-anchor','end')}
const north=text(a.maxX-12*u,a.maxN-18*u,'北 ↑',2.6);north.setAttribute('text-anchor','end');if(data.area===a.id){shape('circle',{cx:data.x,cy:-data.n,r:6*u,fill:'#fff3bb',stroke:'#273c27','stroke-width':1.5*u});const r=data.yaw*Math.PI/180;shape('line',{x1:data.x,y1:-data.n,x2:data.x+Math.sin(r)*18*u,y2:-data.n-Math.cos(r)*18*u,stroke:'#fff3bb','stroke-width':2*u});text(data.x+9*u,data.n-9*u,'現在地',1.8)}
$('map-area-name').textContent=a.id+' '+a.label;$('map-relief-legend').textContent=inside?'室内図 · 濃色＝壁 / 茶＝卓 / 黄＝玄関':terrain?`標高 ${terrain.minY.toFixed(1)}〜${terrain.maxY.toFixed(1)}m · 明るいほど高い場所`:'地形情報を読み込んでいます';const signature=JSON.stringify([data.reviewMode,data.visitedAreas]);if(mapButtonSignature!==signature){mapButtonSignature=signature;buttons($('area-buttons'),graph.areas.map(x=>({label:x.id+' '+x.label,id:x.id,disabled:!data.reviewMode&&!data.visitedAreas?.includes(x.id)})),x=>{mapArea=x.id;drawMap()})}$('map-hint').textContent=data.reviewMode?'確認用：エリアを選び、道をクリックして移動':'訪れたエリアの道をクリックして移動';}

const originalDraw=drawMap;drawMap=function(){originalDraw();$('map-hint').textContent='図面の閲覧用 · 移動はゲーム内で確認'};$('map-photo').onchange=()=>drawMap();Promise.all([fetch('map-review-graph.json').then(r=>r.json()),fetch('map-review-relief.json').then(r=>r.json()),fetch('interior-plan.json').then(r=>r.json())]).then(([g,r,i])=>{graph=g;relief=r;interior=i;drawMap()});
